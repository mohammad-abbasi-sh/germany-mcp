/* ================= PREMIUM-DE-20261118 — Premium Developer Platform (Germany) =====
   Design tokens: Germany identity — deep navy + royal blue + warm gold.
   Light and dark themes are designed independently (dark is NOT an inversion).
   Logical properties throughout — no physical inline direction anywhere, so
   dir flips automatically. */
:root{
  --bg:#F7F9FC; --paper:#FFFFFF; --panel:#EEF2F8; --panel-2:#E3E9F3;
  --ink:#18233B; --mut:#68758C; --line:#E2E8F2; --line-strong:#C9D3E3;
  --primary:#4967E9; --primary-strong:#3B56D6; --primary-dark:#101A36; --secondary:#20386B;
  --accent:#4967E9; --accent-strong:#3B56D6; --accent-ink:#2F4AC0; --accent-soft:#EBEEFD;
  --accent-glow:0 12px 24px -8px rgba(73,103,233,.45);
  --gold:#D89C45; --gold-ink:#8A6420; --gold-soft:#FBF3E2;
  --ok:#0E7A4C; --ok-soft:#E4F5EC; --ok-ink:#FFFFFF; --warn:#92400E; --warn-soft:#FEF3C7;
  --danger:#B42318;
  --hero-bg:#F7F9FC; --hero-ink:#18233B; --hero-mut:#4A5A75; --hero-dim:#68758C;
  --hero-dot:rgba(24,35,59,.09);
  --foot-bg:#101A36; --foot-ink:#FFFFFF; --foot-mut:#C3CDDF; --foot-dim:#8B98B5;
  --console-bg:#101A36; --console-panel:#182344; --console-line:#26345C;
  --console-mut:#9AA8C7; --console-ink:#E6EBF7;
  --shadow:0 1px 2px rgba(16,26,54,.05),0 8px 24px rgba(16,26,54,.06);
  --shadow-lg:0 2px 4px rgba(16,26,54,.06),0 18px 44px rgba(16,26,54,.13);
  --shadow-card:0 1px 2px rgba(16,26,54,.05),0 10px 28px rgba(16,26,54,.07);
  --r-card:20px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  --t-fast:180ms; --t-med:250ms; --ease:cubic-bezier(.2,.7,.3,1);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;font-size:14px;font-weight:700;border:1px solid var(--line);border-radius:var(--r-sm);text-decoration:none;white-space:nowrap;background:var(--paper);color:var(--ink);transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}

/* ---------- hero: light premium band, dot grid + primary wash, dark console ---------- */
.hero{background:var(--hero-bg);color:var(--hero-ink);padding:56px 0 52px;position:relative;overflow:hidden;border-block-end:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--hero-dot) 1px,transparent 1px),radial-gradient(640px 320px at 85% -10%,rgba(73,103,233,.12),transparent 70%),radial-gradient(480px 260px at 8% 110%,rgba(216,156,69,.10),transparent 70%);background-size:26px 26px,100% 100%,100% 100%;pointer-events:none}

.tool-more{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.row-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px}
.row-count{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap}
.row-count b{color:var(--ink);font-size:16px}
.card-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:14px;border-block-start:1px solid var(--line)}
.card-count{display:flex;align-items:baseline;gap:5px;line-height:1.2}
.card-count b{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--ink)}
.card-count span{font-family:var(--mono);font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
[lang="fa"] .card-count span{letter-spacing:0;text-transform:none}
.card-no{font-family:var(--mono);font-size:11px;color:var(--mut)}
.card-details{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.card-details:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.card-details .card-arrow{flex:none}
[dir="rtl"] .card-details .card-arrow{transform:scaleX(-1)}
.card-copy{border:1px solid var(--line);border-radius:10px;background:var(--paper);width:34px;height:34px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.card-copy svg{width:16px;height:16px}
.card-copy:hover{border-color:var(--ink);color:var(--ink)}
.card-copy.copied{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.row-actions{display:flex;gap:6px;align-items:center}
.chev{font-family:var(--mono);font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:10px;background:var(--paper);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.chev:hover{border-color:var(--ink)}
.row.open .chev{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[dir="rtl"] .row-side>.mono{display:inline-block;transform:scaleX(-1)}
.row.static .row-grid{cursor:default}
.drawer{display:none;border-block-start:1px dashed var(--line);padding:18px 22px 22px}
.row.open .drawer{display:block}
.drawer .tools-mini{font-family:var(--mono);font-size:12.5px;color:var(--mut);margin:0 0 12px;line-height:2}
.drawer .tools-mini code{font-size:12px}
.drawer-btns{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- all-mcp meta entry (2026-11-18): main reference, above the catalog ---------- */
.meta-hier{margin:22px 0 0;max-width:640px;font-size:14px;color:var(--hero-mut);border-inline-start:3px solid var(--gold);padding-inline-start:12px}
.meta-hier a{font-weight:700;color:var(--accent-ink);white-space:nowrap}
.meta-band{background:var(--primary-dark);color:#E8EDF7;position:relative;overflow:hidden;border-block-end:1px solid var(--line)}
.meta-band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px),radial-gradient(560px 280px at 88% -10%,rgba(73,103,233,.35),transparent 70%);background-size:26px 26px,100% 100%;pointer-events:none}
.meta-band-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;padding:44px 0;align-items:center}
.meta-band .eyebrow{color:#E8BC74}
.meta-band .eyebrow .tick{background:var(--gold)}
.meta-band h2{font-size:clamp(26px,3.4vw,36px);color:#FFFFFF;margin:0 0 10px}
.meta-band h2 .acc{color:#8FA5F8;font-style:normal}
.meta-band .sub{color:#C3CDDF;font-size:16px;max-width:560px;margin:0}
.meta-nums{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.meta-num{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 14px}
.meta-num b{display:block;font-family:var(--mono);font-size:22px;color:#FFFFFF;line-height:1.2}
.meta-num span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#9AA8C7}
[lang="fa"] .meta-num span{letter-spacing:0;text-transform:none}
.meta-band .btn-ghost{color:#E8EDF7;border-color:rgba(255,255,255,.28);background:transparent}
.meta-band .btn-ghost:hover{background:rgba(255,255,255,.08)}
.meta-install{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-card);padding:20px 22px;box-shadow:var(--shadow-lg)}
.meta-install .lbl{color:#E8BC74}
.meta-install .copy-row{margin-top:12px}
.meta-install .copy-row pre{background:var(--console-bg)}
.meta-card{grid-column:1/-1;border:2px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--paper) 55%)}
[data-theme="dark"] .meta-card{background:linear-gradient(180deg,#1B2542,var(--paper) 60%)}
.meta-card-in{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding:24px;align-items:start}
.meta-card-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.meta-connect{border:1px solid var(--accent);border-inline-start:4px solid var(--accent);border-radius:var(--r-md);background:var(--accent-soft);padding:18px 20px;margin:0 0 24px}
.meta-connect h2{font-size:19px;margin:8px 0 6px}
.meta-connect p{color:var(--mut);margin:0 0 12px;font-size:14.5px}
.meta-connect p:last-child{margin-bottom:0}
@media (max-width:900px){
  .meta-band-in{grid-template-columns:1fr;gap:24px;padding:32px 0}
  .meta-card-in{grid-template-columns:1fr}
}
/* compact rows (tool-page rail, favorites) */
.row-mini{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);cursor:pointer;margin:2px 6px}
.row-mini:hover{background:var(--panel);text-decoration:none}
.row-mini.active{background:var(--accent-soft)}
.row-mini .rid{font-family:var(--mono);font-size:11px;color:var(--mut)}
.row-mini .rnm{font-size:13.5px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.row-mini .rnm small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--mut);direction:ltr;text-align:start}
.row-mini .cnt{font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:nowrap}
/* ---------- badges / chips (shape + color + text, never color-only) ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 10px;background:var(--paper);color:var(--ink);white-space:nowrap}
[lang="fa"] .badge{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:12px}
.badge-ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.badge-feat{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
.badge-soon{border-color:var(--mut);color:var(--mut)}
.badge-warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;text-decoration:none}
button.chip:hover{border-color:var(--ink)}
a.chip:hover{text-decoration:none}
.star-btn{border:1px solid var(--line);border-radius:10px;background:var(--paper);width:34px;height:34px;font-size:16px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.star-btn:hover{border-color:var(--ink)}
.star-btn.on{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
/* ---------- marketplace: sticky filter rail + cards ---------- */
.mp-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:92px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.rail-head{padding:12px 14px;border-block-end:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.rail-item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:start;background:none;border:none;border-radius:0;border-block-end:1px solid var(--line);padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.rail-item:last-child{border-block-end:none}
.rail-item:hover{background:var(--panel)}
.rail-item.on{background:var(--accent-soft);border-inline-start:3px solid var(--accent);padding-inline-start:11px}
.rail-item .rc{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.rail-item .cc{font-family:var(--mono);font-size:11px;color:var(--mut);margin-inline-end:8px}
.rail select{margin:12px;width:calc(100% - 24px)}
.filters-btn{display:none;width:100%;margin-bottom:14px}
/* bottom sheet (mobile filters) */
.sheet-scrim{position:fixed;inset:0;background:rgba(7,10,20,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:81;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);max-height:78vh;overflow-y:auto;transform:translateY(102%);transition:transform .3s ease;padding:0 0 24px}
.sheet.open{transform:translateY(0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-block-end:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.sheet-head .icon-btn{background:var(--paper);border-color:var(--line);color:var(--ink)}
.sheet .rail-item{padding:12px 20px}
/* ---------- split master-detail (tool page) ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;align-items:start}
.split>*{min-width:0}
.ledger-rail{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow);max-height:calc(100vh - 140px);overflow-y:auto;position:sticky;top:92px;padding:6px 0}
.ledger-rail .rail-head{position:sticky;top:0;background:var(--paper);z-index:1;margin:0 0 6px}
.inspector{position:sticky;top:92px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
.inspector-head{padding:16px 18px;border-block-end:1px solid var(--line)}
.inspector-head h1{font-size:22px;margin:0}
.inspector-head .latin{font-family:var(--mono);font-size:12.5px;color:var(--mut);direction:ltr;text-align:start;margin:4px 0 10px;overflow-wrap:anywhere}
.inspector-body{padding:16px 18px}
.inspector-body h2{font-size:15px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 10px}
[lang="fa"] .inspector-body h2{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:16px}
.inspector-body h2:first-child{margin-top:0}
.install-box{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:14px;margin-bottom:12px}
.install-box h3{font-size:14px;margin-bottom:10px;font-family:var(--mono)}
.copy-row{display:flex;gap:0;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--console-bg)}
.copy-row>*{min-width:0}
.copy-row pre{flex:1;margin:0;border:none;border-radius:0;white-space:pre-wrap;overflow-wrap:anywhere;overflow-x:visible}
.copy-btn{border:none;border-radius:0;border-inline-start:1px solid var(--line);background:var(--paper);padding:0 16px;font-weight:700;font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap;min-width:92px}
.copy-btn:hover{background:var(--panel)}
.copy-btn.copied{background:var(--ok);color:var(--ok-ink)}
/* ---------- toolbar / search ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.toolbar .search-box{flex:1;min-width:220px;position:relative}
.toolbar .search-box input{padding-inline-start:40px}
.toolbar .search-box .mag{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;font-family:var(--mono)}
.toolbar select{width:auto;min-width:170px}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:var(--r-card);background:var(--paper)}
.empty .big{font-family:var(--mono);font-size:14px;color:var(--accent-ink);margin-bottom:10px;letter-spacing:.14em}
.empty h3{font-size:19px}
.empty p{color:var(--mut)}
/* ---------- tables ---------- */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tools-table{width:100%;border-collapse:collapse;font-size:14px}
.tools-table th,.tools-table td{text-align:start;padding:10px 12px;vertical-align:top}
.tools-table th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);background:var(--panel)}
[lang="fa"] .tools-table th{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:13px}
.tools-table thead th{border-block-end:1px solid var(--line)}
.tools-table tbody tr + tr td{border-block-start:1px solid var(--line)}
.tools-table code{white-space:nowrap}
/* ---------- forms / callouts ---------- */
.form-card{max-width:480px;margin:0 auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow);padding:32px}
.form-card h1{font-size:24px;text-align:center}
.form-card .sub{text-align:center;color:var(--mut);font-size:14.5px}
.field{margin-bottom:16px}
.note{font-size:13.5px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:var(--r-sm);padding:12px 14px;margin-top:16px}
.callout{border:1px solid var(--line);border-inline-start:3px solid var(--ok);border-radius:var(--r-md);background:var(--ok-soft);padding:16px 18px;margin:20px 0}
.callout h3{font-size:16px;margin:0 0 6px}
.callout p{color:var(--mut);margin:0;font-size:14.5px}
.callout-warn{border-inline-start-color:var(--warn);background:var(--warn-soft)}
/* ---------- connect guide: rounded rocker switch ---------- */
.rocker-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 24px}
.rocker{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(480px,100%);border:1px solid var(--line);border-radius:var(--r-pill);background:var(--panel);user-select:none;padding:4px}
.rocker-knob{position:absolute;top:4px;bottom:4px;width:calc(50% - 8px);inset-inline-start:4px;background:var(--primary);border-radius:var(--r-pill);box-shadow:var(--accent-glow);transition:inset-inline-start .28s cubic-bezier(.6,0,.2,1);z-index:0}
.rocker.tech .rocker-knob{inset-inline-start:calc(50% + 4px)}
.rocker button{position:relative;z-index:1;background:transparent;border:none;border-radius:var(--r-pill);padding:13px 10px;font-size:14px;font-weight:700;color:var(--mut)}
.rocker button.on{color:#FFFFFF}
.rocker button .rk{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;margin-top:2px;opacity:.75}
[lang="fa"] .rocker button .rk{letter-spacing:0}
.rocker-note{font-family:var(--mono);font-size:11.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
[lang="fa"] .rocker-note{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:13px}
.guide-lead{font-size:17px;color:var(--mut);max-width:760px}
.guide-steps{list-style:none;margin:24px 0;padding:0;counter-reset:gstep}
.guide-step{position:relative;padding:0 0 26px 0;padding-inline-start:60px;counter-increment:gstep}
.guide-step::before{content:counter(gstep,decimal-leading-zero);position:absolute;inset-inline-start:0;top:0;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:15px}
.guide-step h3{font-size:17.5px;margin:2px 0 6px}
.guide-step p{color:var(--mut);font-size:15px;margin:0 0 10px}
.guide-step .copy-row{margin:10px 0 4px}
.guide-step .os-label{font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
.path-list{list-style:none;margin:12px 0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.path-list li{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 14px;border-block-end:1px solid var(--line);font-size:14.5px}
.path-list li:last-child{border-block-end:none}
.path-list .os{min-width:76px;font-weight:700;font-family:var(--mono);font-size:13px}
.path-list code{overflow-wrap:anywhere}
.trouble{list-style:none;margin:12px 0;padding:0}
.trouble li{margin-bottom:14px;border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.trouble li b{display:block;font-size:15.5px}
.trouble li span{color:var(--mut);font-size:14.5px}
.app-pick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.app-pick button{border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--ink)}
.app-pick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* ---------- articles / tutorials ---------- */
.article-body{max-width:760px}
.article-body h2{font-size:22px;margin:28px 0 10px}
.article-body p{color:var(--mut);font-size:16px}
.article-body ol,.article-body ul{color:var(--mut);font-size:16px;line-height:1.9}
.post-meta{display:flex;gap:14px;color:var(--mut);font-size:13.5px;flex-wrap:wrap;margin-bottom:18px;font-family:var(--mono)}
.cover-idx{font-family:var(--mono);font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:var(--r-pill);background:var(--panel);padding:3px 10px}
/* ---------- stats / faq ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:26px}
.stat{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.stat b{font-size:28px;display:block;font-family:var(--mono)}
.stat span{color:var(--mut);font-size:13.5px}
details.faq{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);margin-bottom:10px}
details.faq summary{cursor:pointer;padding:16px 20px;font-weight:700;font-size:16px;list-style:none;display:flex;gap:12px;align-items:baseline}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{content:"+";font-family:var(--mono);color:var(--accent-ink);font-weight:700;flex:none}
details.faq[open ] summary::before{content:"−"}
details.faq summary:hover{background:var(--panel)}
details.faq[open ]{border-color:var(--accent)}
details.faq p{color:var(--mut);padding:0 20px 16px 46px;margin:0}
/* ---------- command palette (⌘K) ---------- */
.pal-scrim{position:fixed;inset:0;background:rgba(7,10,20,.55);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.pal-scrim.open{opacity:1;pointer-events:auto}
.pal{position:fixed;inset-inline:0;top:10vh;margin-inline:auto;width:min(620px,calc(100vw - 32px));z-index:91;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s,transform .2s;overflow:hidden}
.pal.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.pal-input-row{display:flex;align-items:center;gap:10px;border-block-end:1px solid var(--line);padding:0 16px}
.pal-input-row .mag{font-family:var(--mono);color:var(--mut)}
.pal-input{border:none !important;padding:16px 0;font-size:16px;flex:1;min-width:0;background:transparent}
.pal-input:focus{box-shadow:none}
.pal-hint{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
.pal-list{max-height:min(52vh,420px);overflow-y:auto;padding:8px 0}
.pal-group{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:12px 16px 6px}
[lang="fa"] .pal-group{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:12.5px}
.pal-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-radius:10px;margin:2px 8px}
.pal-item .pid{font-family:var(--mono);font-size:11px;color:var(--mut)}
.pal-item .pnm{font-weight:700;font-size:14.5px;overflow-wrap:anywhere;min-width:0}
.pal-item .pnm small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.pal-item .ptag{font-family:var(--mono);font-size:11px;color:var(--mut);white-space:nowrap}
.pal-item.active{background:var(--accent-soft)}
.pal-foot{display:flex;justify-content:space-between;gap:12px;border-block-start:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:11px;color:var(--mut)}
.pal-foot kbd{border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel);font-family:var(--mono)}
/* ---------- copy ripple ---------- */
.ripple-ink{position:absolute;top:0;inset-inline-start:0;border-radius:50%;background:var(--accent);opacity:.28;scale:0;animation:ripple .55s ease-out forwards;pointer-events:none;z-index:0}
@keyframes ripple{to{scale:1;opacity:0}}
.rip{position:relative;overflow:hidden}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols-2>*{min-width:0}
.ask-card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
/* ---------- footer: dark navy, bookends the hero ---------- */
footer.site{margin-top:72px;background:var(--foot-bg);color:var(--foot-mut);border-block-start:3px solid var(--primary)}
footer.site .brand{color:#FFFFFF}
footer.site .brand small{color:var(--foot-dim)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;padding:48px 0 32px}
.foot-grid h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--foot-dim);margin:0 0 14px}
[lang="fa"] .foot-grid h4{letter-spacing:0;text-transform:none;font-family:var(--fa);font-size:14px}
.foot-grid a{display:block;color:var(--foot-mut);font-size:14px;margin-bottom:9px;text-decoration:none}
.foot-grid a:hover{color:#FFFFFF;text-decoration:underline;text-decoration-color:var(--gold)}
.foot-grid p{color:var(--foot-mut);font-size:14px}
.foot-bottom{border-block-start:1px solid rgba(255,255,255,.12);padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--foot-dim);font-size:13px;font-family:var(--mono)}
.socials{display:flex;gap:8px;margin-top:14px}
.socials a{width:38px;height:38px;border:1px solid rgba(255,255,255,.16);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--foot-mut);font-size:14px;font-family:var(--mono);text-decoration:none}
.socials a:hover{color:#FFFFFF;border-color:rgba(255,255,255,.4);text-decoration:none}
/* ---------- a11y ---------- */
.skip{position:absolute;inset-inline-start:-9999px}
.skip:focus{position:fixed;inset-inline-start:16px;top:16px;z-index:200;background:var(--primary);color:#FFFFFF;padding:10px 18px;font-weight:700;text-decoration:none;border-radius:var(--r-sm)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--primary);color:#FFFFFF}
/* ---------- responsive ---------- */
@media (max-width:1020px){
  nav.main{display:none}
  .nav-strip{display:block}
  .hero-grid{grid-template-columns:1fr;gap:32px}
  .split{grid-template-columns:1fr}
  .ledger-rail{position:static;max-height:420px;order:2}
  .inspector{position:static;order:1}
  .mp-layout{grid-template-columns:1fr}
  .rail{display:none}
  .filters-btn{display:block}
  .foot-grid{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr}
  .card-grid{grid-template-columns:1fr 1fr}
  .benefit-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .section{padding:40px 0 4px}
  .hero{padding:36px 0 28px}
  .hero h1{font-size:32px}
  .hero-search{flex-direction:column}
  .hero-search .btn{width:100%}
  .section-head h2{font-size:23px}
  .spec-strip{grid-template-columns:repeat(2,1fr)}
  .row-grid{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:16px}
  .card-grid{grid-template-columns:1fr}
  .srv-card .row-grid{padding:18px}
  .srv-card .tile{width:48px;height:48px}
  .srv-card .tile svg{width:24px;height:24px}
  .chip{white-space:normal}
  .row-side{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between}
  .drawer{padding:14px 16px 16px}
  .row-mini{grid-template-columns:46px minmax(0,1fr) auto}
  .foot-grid{grid-template-columns:1fr}
  .brand{font-size:15px}
  .brand>span:last-child{display:none}
  .nav{gap:8px}
  .nav-right{gap:6px}
  .icon-btn{min-width:34px;height:34px;font-size:13px}
  .lang-switch button{padding:9px 7px;font-size:11px}
  .icon-btn kbd{display:none}
  .copy-row{flex-direction:column}
  .copy-row .copy-btn{padding:12px 16px;border-inline-start:none;border-block-start:1px solid var(--line);width:100%}
  .form-card{padding:24px 20px}
  .pal{top:6vh}
  .pal-item{grid-template-columns:52px minmax(0,1fr)}
  .pal-item .ptag{display:none}
  .cols-2{grid-template-columns:1fr}
  .benefit-grid{grid-template-columns:1fr}
}
/* ================= PORT 2026-11-18 (feature port, no-backend) ================= */
/* Banner */
.top-banner{background:var(--primary-dark);color:#E8EDF8;font-size:13.5px;padding:9px 0;position:relative;z-index:70}
.top-banner .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between}
.top-banner a{color:var(--gold);text-decoration-color:var(--gold)}
.top-banner button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:120;opacity:0;transition:transform .3s ease,opacity .3s ease;pointer-events:none;box-shadow:var(--shadow-lg);max-width:min(92vw,480px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Mobile bottom nav */
.mobnav{display:none}
@media (max-width:600px){
  .mobnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:70;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(7,10,20,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobnav a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:11px;font-weight:700;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;gap:2px;align-items:center}
  .mobnav a .mi{font-size:17px;line-height:1}
  .mobnav a.active{color:var(--accent-ink);background:var(--accent-soft)}
  body{padding-bottom:64px}
  footer.site{margin-bottom:0}
}
/* What's New modal */
.wn-scrim{position:fixed;inset:0;background:rgba(7,10,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.wn-card{background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow-lg);max-width:520px;width:100%;padding:28px;max-height:86vh;overflow-y:auto}
.wn-card h2{font-size:21px}
.wn-card ul{color:var(--mut);line-height:1.9;margin:0 0 18px;padding-inline-start:20px}
/* Builder */
.builder-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.builder-list{max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);padding:8px}
.builder-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;cursor:pointer}
.builder-row:hover{background:var(--panel)}
.builder-row input[type="checkbox"]{width:18px;height:18px;margin-top:4px;flex:none;accent-color:var(--accent)}
.builder-row .bname{font-weight:700;font-size:14.5px}
.builder-row .bdesc{color:var(--mut);font-size:13px;line-height:1.5}
.builder-out{position:sticky;top:92px}
.profile-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
@media (max-width:1020px){.builder-layout{grid-template-columns:1fr}.builder-out{position:static}}
/* Install panel */
.ip-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ip-tabs button{border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink)}
.ip-tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.os-toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:var(--paper)}
.os-toggle button{border:none;border-radius:0;background:transparent;padding:8px 14px;font-size:13px;font-weight:700;color:var(--mut)}
.os-toggle button.on{background:var(--primary);color:#FFFFFF}
/* Demo cards */
.demo-qa{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.demo-qa .dq{font-weight:700;font-size:16px;margin-bottom:10px}
.demo-qa .da{color:var(--mut);font-size:14.5px;margin:10px 0 0}
.sample-tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r-pill);padding:3px 10px;margin-bottom:10px}
/* Status table */
.status-badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;font-weight:700;border-radius:var(--r-pill);padding:4px 10px}
.status-ok{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok)}
.status-unknown{color:var(--mut);background:var(--panel);border:1px solid var(--line)}
/* Guide */
.guide-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
.guide-toc{position:sticky;top:92px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);padding:16px}
.guide-toc a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--mut);font-size:14px;font-weight:600}
.guide-toc a:hover{background:var(--panel);color:var(--ink)}
.guide-sec{margin-bottom:36px}
.guide-sec h2{font-size:21px;margin-bottom:10px}
.guide-sec p,.guide-sec li{color:var(--mut);font-size:15.5px}
@media (max-width:1020px){.guide-layout{grid-template-columns:1fr}.guide-toc{position:static}}
/* Forms */
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.field-row{grid-template-columns:1fr}}
.char-count{font-family:var(--mono);font-size:11.5px;color:var(--mut);text-align:end}
/* Filter checkboxes in rail */
.rail-checks{padding:12px 14px;border-top:1px solid var(--line)}
.rail-checks label{display:flex;gap:8px;align-items:baseline;font-weight:500;font-size:13.5px;margin-bottom:8px;cursor:pointer}
.rail-checks input[type="checkbox"]{width:16px;height:16px;flex:none;accent-color:var(--accent);transform:translateY(2px)}
.rail-checks .rc{font-family:var(--mono);font-size:11px;color:var(--mut);margin-inline-start:auto}
/* App picker cards (home) */
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.app-card{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.app-card:hover{border-color:var(--accent);text-decoration:none}
.app-card .aic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.app-card b{display:block;font-size:15px}
.app-card span{color:var(--mut);font-size:12.5px}
@media (max-width:600px){.app-grid{grid-template-columns:1fr}}
/* Chips row under hero search */
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-chips button{background:var(--paper);border:1px solid var(--line);color:var(--mut);border-radius:var(--r-pill);padding:6px 13px;font-size:13px;font-weight:600;transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.hero-chips button:hover{color:var(--ink);border-color:var(--line-strong)}
/* Breadcrumb */
.crumb{font-size:13.5px;color:var(--mut);margin-bottom:14px}
.crumb a{color:var(--mut)}
/* Read-before-install table */
.rbi{width:100%;border-collapse:collapse;font-size:14px}
.rbi td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rbi td:first-child{font-weight:700;width:34%;color:var(--ink)}
.rbi td:last-child{color:var(--mut)}
/* Footer feedback */
.foot-feedback textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#E8EDF8;font-size:13.5px;border-radius:10px;padding:10px 12px;min-height:64px;resize:vertical}
.foot-feedback textarea::placeholder{color:var(--foot-dim)}
.foot-warn{border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;color:var(--foot-mut);font-size:13px;margin-top:18px}
.foot-warn b{color:var(--gold)}
/* Detail extra sections */
.detail-sec{margin-top:32px}
.detail-sec h2{font-size:19px;margin-bottom:12px}
.faq-mini details.faq summary{font-size:15px;padding:13px 16px}
.show-more-btn{width:100%;margin-top:10px}

/* ---------- reduced motion: everything still, everywhere ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .demo-body .cursor{animation:none}
}

const ARTICLES = [

 {id:"what-is-mcp",cat:"basics",date:"2026-11-09",mins:6,cover:"g1",icon:"🔌",
  title:{fa:"MCP چیست؟ به زبان ساده",de:"Was ist MCP? Einfach erklärt",en:"What is MCP, in plain language"},
  ex:{fa:"پروتکل اتصال هوش مصنوعی به دنیای واقعی — بدون اصطلاحات پیچیده، با مثال‌های واقعی.",de:"Das Protokoll, das KI mit der echten Welt verbindet — ohne Fachjargon, mit echten Beispielen.",en:"The protocol that connects AI to the real world — no jargon, with real examples."},
  body:{fa:["مدل‌های هوش مصنوعی متن می‌نویسند، اما به‌تنهایی به دنیای بیرون دسترسی ندارند: نمی‌دانند جدول بوندس‌لیگا امروز چطور است، بهترین گلزن کیست یا فردا چه بازی‌هایی برگزار می‌شود. MCP یا «پروتکل زمینهٔ مدل» (Model Context Protocol) یک قرارداد استاندارد است که به دستیار هوش مصنوعی اجازه می‌دهد با ابزارهای بیرونی صحبت کند.","به زبان ساده: MCP یک «پریز استاندارد» است. هر سرویس — لیگ فوتبال، سایت خبری، ادارهٔ هواشناسی — یک «دوشاخه» می‌سازد و دستیار شما می‌تواند آن را وصل کند و سؤال شما را به یک فراخوانی ابزار تبدیل کند. بدون MCP، هر اتصال یک کار سفارشی و یک‌باره بود؛ با MCP، یک بار وصل می‌شوی و همه‌جا کار می‌کند.","سرورهای این کاتالوگ دقیقاً همین کار را می‌کنند: هر کدام یک سرویس آلمان را — مثلاً بوندس‌لیگا از طریق OpenLigaDB — به دستیار شما وصل می‌کنند. همه فقط‌خواندنی‌اند: داده می‌خوانند، اما هرگز وارد حساب شما نمی‌شوند، خرید نمی‌کنند و چیزی را تغییر نمی‌دهند.","برای شروع، کافی است یک سرور را با uvx نصب کنی و آن را به Claude Code یا Cursor وصل کنی. از آن لحظه، به‌جای باز کردن ده تب مرورگر، از دستیارت می‌پرسی — و جواب را با عدد و منبع می‌گیری."],
         de:["KI-Modelle schreiben Texte, aber allein erreichen sie die Außenwelt nicht: Sie wissen nicht, wie die Bundesliga-Tabelle heute aussieht, wer der beste Torschütze ist oder welche Spiele morgen stattfinden. MCP — das Model Context Protocol — ist ein Standardvertrag, der es einem KI-Assistenten erlaubt, mit externen Tools zu sprechen.","Einfach gesagt: MCP ist eine Standard-„Steckdose“. Jeder Dienst — Fußball-Liga, Nachrichtenseite, Wetteramt — baut einen „Stecker“, und dein Assistent kann ihn einstecken und deine Frage in einen Tool-Aufruf verwandeln. Ohne MCP war jede Verbindung eine einmalige Sonderanfertigung; mit MCP verbindest du dich einmal und es funktioniert überall.","Die Server in diesem Katalog tun genau das: Jeder verbindet einen deutschen Dienst — zum Beispiel die Bundesliga über OpenLigaDB — mit deinem Assistenten. Alle sind nur lesend: Sie lesen Daten, melden sich aber nie in deinem Konto an, kaufen nichts und ändern nichts.","Zum Start installierst du einfach einen Server mit uvx und verbindest ihn mit Claude Code oder Cursor. Von da an fragst du, statt zehn Browser-Tabs zu öffnen, deinen Assistenten — und bekommst die Antwort mit Zahlen und Quelle."],
         en:["AI models write text, but on their own they cannot reach the outside world: they don't know what the Bundesliga table looks like today, who the top scorer is, or which matches are played tomorrow. MCP — the Model Context Protocol — is a standard contract that lets an AI assistant talk to outside tools.","Simply put, MCP is a standard “socket”. Every service — a football league, a news site, a weather office — builds a “plug”, and your assistant can connect it and turn your question into a tool call. Without MCP, every connection was a custom one-off job; with MCP, you connect once and it works everywhere.","The servers in this catalog do exactly that: each one connects a German service — the Bundesliga via OpenLigaDB, for example — to your assistant. All of them are read-only: they read data but never log in to your account, never buy anything and never change anything.","To start, just install a server with uvx and connect it to Claude Code or Cursor. From then on, instead of opening ten browser tabs, you ask your assistant — and get the answer with numbers and a source."]}},

  title:{fa:"کدام کلاینت MCP برای شما مناسب است؟",de:"Welcher MCP-Client passt zu dir?",en:"Which MCP client is right for you?"},
  ex:{fa:"Claude Code، Cursor، Claude Desktop یا VS Code — انتخاب درست به روش کارت بستگی دارد.",de:"Claude Code, Cursor, Claude Desktop oder VS Code — die richtige Wahl hängt davon ab, wie du arbeitest.",en:"Claude Code, Cursor, Claude Desktop or VS Code — the right choice depends on how you work."},
  body:{fa:["اگر بیشتر در ترمینال کار می‌کنی، Claude Code سریع‌ترین راه است: یک دستور، و سرور وصل است. برای کسانی که با خط فرمان راحت‌اند، هیچ راه ساده‌تری نیست.","اگر برنامه‌نویس هستی و در ویرایشگر کد زندگی می‌کنی، Cursor یا VS Code انتخاب طبیعی است؛ سرور در کنار کدت قرار می‌گیرد و می‌توانی از دستیار بخواهی هم‌زمان کد و دادهٔ واقعی را ببیند.","اگر فقط می‌خواهی گفت‌وگو کنی و سؤال بپرسی، Claude Desktop ساده‌ترین گزینه است: یک بار فایل پیکربندی را ویرایش می‌کنی و بعد همه‌چیز در چت است.","یک نکتهٔ مهم: سرورهای محلی فقط روی کامپیوتر خودت اجرا می‌شوند و در نسخهٔ وب claude.ai یا ChatGPT کار نمی‌کنند. برای این سرورها به یک برنامهٔ دسکتاپ یا خط فرمان نیاز داری — مثلاً Claude Desktop."],
         de:["Wenn du hauptsächlich im Terminal arbeitest, ist Claude Code der schnellste Weg: ein Befehl und der Server ist verbunden. Für alle, die sich mit der Kommandozeile wohlfühlen, gibt es nichts Einfacheres.","Wenn du programmierst und in einem Code-Editor lebst, sind Cursor oder VS Code die natürliche Wahl; der Server sitzt neben deinem Code und du kannst den Assistenten bitten, Code und echte Daten gleichzeitig zu sehen.","Wenn du nur chatten und Fragen stellen willst, ist Claude Desktop die einfachste Option: Du bearbeitest die Konfigurationsdatei einmal, und danach läuft alles im Chat.","Ein wichtiger Hinweis: Lokale Server laufen nur auf deinem eigenen Computer und funktionieren nicht in der Webversion von claude.ai oder ChatGPT. Für diese Server brauchst du eine Desktop-App oder einen Kommandozeilen-Client — zum Beispiel Claude Desktop."],
         en:["If you mostly live in the terminal, Claude Code is the fastest path: one command and the server is connected. For anyone comfortable with the command line, there is nothing simpler.","If you are a programmer who lives in a code editor, Cursor or VS Code is the natural choice; the server sits next to your code and you can ask the assistant to see code and real data at the same time.","If you only want to chat and ask questions, Claude Desktop is the simplest option: you edit the config file once, and afterwards everything happens in the chat.","One important note: local servers run only on your own computer and do not work in the web version of claude.ai or ChatGPT. For these servers you need a desktop app or a command-line client — for example Claude Desktop."]}},
 {id:"germany-servers",cat:"guides",date:"2026-11-09",mins:7,cover:"g3",icon:"🇩🇪",
  title:{fa:"سرورهای آلمان چطور کار می‌کنند؟",de:"Wie funktionieren die Deutschland-Server?",en:"How do the Germany servers work?"},
  ex:{fa:"پشت صحنهٔ سرورهای فقط‌خواندنی: از کجا داده می‌خوانند، چه چیزی را نمی‌توانند انجام دهند و چرا امن‌اند.",de:"Hinter den Kulissen der Nur-Lesen-Server: woher sie Daten lesen, was sie nicht können und warum sie sicher sind.",en:"Behind the scenes of the read-only servers: where they read data, what they cannot do, and why they are safe."},
  body:{fa:["هر سرور این کاتالوگ یک برنامهٔ کوچک پایتون است که با uvx اجرا می‌شود. وقتی دستیارت سؤالی می‌پرسد — مثلاً «صدر جدول بوندس‌لیگا کیه؟» — سرور به منبع مربوطه سر می‌زند، داده را می‌خواند و جواب ساخت‌یافته برمی‌گرداند.","داده‌ها همیشه زنده‌اند: جدول و نتایج بوندس‌لیگا از API رایگان OpenLigaDB خوانده می‌شوند. هیچ پایگاه دادهٔ قدیمی و هیچ عدد حدسی در میان نیست.","مهم‌ترین اصل طراحی این سرورها «فقط‌خواندنی» بودن است. آن‌ها هیچ حساب کاربری، رمز عبور یا توکنی ندارند؛ نمی‌توانند وارد حسابت شوی، خرید کنند یا رزرو انجام دهند. بدترین کاری که یک سرور خراب می‌تواند بکند، برگرداندن یک جواب اشتباه است — و تو همیشه می‌توانی آن را با باز کردن منبع بررسی کنی.","همهٔ سرورها متن‌باز‌اند و کدشان در گیت‌هاب است. اگر کنجکاوی، می‌توانی دقیقاً ببینی هر ابزار چه درخواستی می‌فرستد و چه چیزی برمی‌گرداند. شفافیت، به‌جای اعتماد کورکورانه، اصل این پروژه است."],
         de:["Jeder Server in diesem Katalog ist ein kleines Python-Programm, das mit uvx läuft. Wenn dein Assistent eine Frage stellt — zum Beispiel „Wer führt die Bundesliga-Tabelle an?“ — geht der Server zur entsprechenden Quelle, liest die Daten und gibt eine strukturierte Antwort zurück.","Die Daten sind immer live: Tabelle und Ergebnisse der Bundesliga kommen aus der kostenlosen OpenLigaDB-API. Es gibt keine veraltete Datenbank und keine geratenen Zahlen.","Das wichtigste Designprinzip dieser Server ist, dass sie nur lesend sind. Sie haben kein Benutzerkonto, kein Passwort und kein Token; sie können sich nicht in deinem Konto anmelden, nichts kaufen und nichts reservieren. Das Schlimmste, was ein defekter Server tun kann, ist eine falsche Antwort zurückzugeben — und das kannst du jederzeit überprüfen, indem du die Quelle öffnest.","Alle Server sind Open Source und ihr Code ist auf GitHub. Wenn du neugierig bist, kannst du genau sehen, welche Anfrage jedes Tool sendet und was es zurückgibt. Transparenz statt blindem Vertrauen ist das Prinzip dieses Projekts."],
         en:["Each server in this catalog is a small Python program that runs with uvx. When your assistant asks a question — “Who tops the Bundesliga table?” — the server visits the relevant source, reads the data and returns a structured answer.","The data is always live: the Bundesliga table and results come from the free OpenLigaDB API. There is no stale database and no guessed numbers.","The most important design principle of these servers is that they are read-only. They have no user account, no password and no token; they cannot log in to your account, buy anything or make a reservation. The worst thing a broken server can do is return a wrong answer — and you can always check it by opening the source.","All servers are open source and their code is on GitHub. If you are curious, you can see exactly what request each tool sends and what it returns. Transparency, instead of blind trust, is this project's principle."]}}

];

function fmtDate(iso){ try{ return new Intl.DateTimeFormat(loc(),{year:"numeric",month:"long",day:"numeric"}).format(new Date(iso+"T00:00:00")); }catch(e){ return iso; } }

const PAGES = ["home","marketplace","tool","categories","skills","skill","tutorials","tutorial","blog","article","about","contact","favorites","ask","connect","builder","demo","status","guide","submit","my","privacy","terms"];
function parseHash(){
  const raw = location.hash||"";
  if(raw && !raw.startsWith("#/")){
    const id = raw.slice(1);
    if(/^[A-Za-z][\w-]*$/.test(id)){ state.anchor = id; return; }
  }
  let h = raw.replace(/^#\/?/,"");
  state.query = {};
  const qi = h.indexOf("?");
  if(qi>=0){ const qs = h.slice(qi+1); h = h.slice(0,qi);
    qs.split("&").forEach(p=>{ const kv = p.split("="); if(kv[0]){ try{ state.query[decodeURIComponent(kv[0])] = kv[1]?decodeURIComponent(kv[1]):""; }catch(e){} } }); }
  const hi = h.indexOf("#");
  if(hi>=0){ state.anchor = h.slice(hi+1); h = h.slice(0,hi); }
  const parts = h.split("/").filter(Boolean);
  let lang = parts[0], page = parts[1]||"home", param = parts[2]||null;
  if(!["fa","de","en"].includes(lang)){ lang = state.lang; page = parts[0]||"home"; param = parts[1]||null; }
  if(!PAGES.includes(page)){ state.page="404"; state.param=page; state.lang=lang; return; }
  state.lang = lang; state.page = page; state.param = param;
}
function go(page, param){ location.hash = hashFor(page, param); window.scrollTo({top:0}); }

function askNorm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه")
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[^a-z0-9\u0600-\u06FF ]/g," ").replace(/\s+/g," ").trim();
}
function askTokens(q){ return askNorm(q).split(" ").filter(w=>w.length>1); }
function askHay(s){
  return askNorm([s.id, s.title, s.title_de||"", s.desc, s.desc_fa, s.desc_de||"", s.cat,
    s.tools.map(x=>x.n+" "+x.s+" "+(x.sf||"")+" "+(x.st||"")).join(" ")].join(" "));
}
function askScore(q){
  const toks = askTokens(q);
  if(!toks.length) return [];
  const intents = ASK_INTENTS.map(it=>{
    const kws = Object.keys(it.kw).reduce((a,k)=>a.concat(it.kw[k].map(askNorm)),[]);
    const hit = [];
    toks.forEach(w=>{
      kws.forEach(k=>{
        k.split(" ").forEach(kw=>{
          if(kw && (kw===w || (kw.length>=3 && w.indexOf(kw)>=0) || (w.length>3 && kw.indexOf(w)>=0)) && hit.indexOf(kw)<0) hit.push(kw);
        });
      });
    });
    return {cats:it.cats, hit};
  }).filter(x=>x.hit.length);
  return SERVERS.map(s=>{
    const hay = askHay(s);
    let score = 0; const matched = [];
    toks.forEach(w=>{ if(hay.indexOf(w)>=0){ score += 2; if(matched.indexOf(w)<0) matched.push(w); } });
    intents.forEach(it=>{
      if(it.cats.indexOf(s.cat)>=0){ score += 3*it.hit.length; it.hit.forEach(kw=>{ if(matched.indexOf(kw)<0) matched.push(kw); }); }
    });
    return {s, score, matched};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

/* ---------------- copy: ripple + COPIED flip (no toast) ---------------- */
function fallbackCopy(txt, done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); done(); }
function ripple(host, ev){
  if(reducedMotion() || !host || !ev) return;
  const r = host.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 1.15;
  const ink = document.createElement("span");
  ink.className = "ripple-ink";
  ink.style.width = ink.style.height = d + "px";
  const cx = (ev.clientX!=null?ev.clientX:r.left+r.width/2) - r.left - d/2;
  const cy = (ev.clientY!=null?ev.clientY:r.top+r.height/2) - r.top - d/2;
  ink.style.transform = "translate("+cx+"px,"+cy+"px)";
  host.classList.add("rip");
  host.appendChild(ink);
  setTimeout(()=>{ if(ink.parentNode) ink.parentNode.removeChild(ink); }, 600);
}
function copyText(txt, btn, ev){
  const done=()=>{
    if(btn){
      if(btn.dataset.label===undefined) btn.dataset.label = btn.textContent;
      btn.textContent = "✓ COPIED";
      btn.classList.add("copied");
      clearTimeout(btn._t);
      btn._t = setTimeout(()=>{ btn.textContent = btn.dataset.label; btn.classList.remove("copied"); }, 1800);
    }
    const host = btn ? btn.closest(".row,.install-box,.inspector,.console,.drawer") : null;
    if(host) ripple(host, ev);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt,done);
}

/* ---------------- FLIP grid-snap on filter ---------------- */
function flipSwap(el, html){
  if(!el){ return; }
  if(reducedMotion()){ el.innerHTML = html; return; }
  const before = {};
  el.querySelectorAll("[data-row]").forEach(n=>{ before[n.dataset.row] = n.getBoundingClientRect().top; });
  el.innerHTML = html;
  el.querySelectorAll("[data-row]").forEach(n=>{
    const b = before[n.dataset.row];
    if(b===undefined) return;
    const dy = b - n.getBoundingClientRect().top;
    if(!dy) return;
    n.style.transition = "none";
    n.style.transform = "translateY("+dy+"px)";
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      n.style.transition = "";
      n.style.transform = "";
    });});
  });
}

/* ---------------- demo typing (instant under reduced motion) ---------------- */
let demoIdx = 0, demoTimer = null, typeToken = 0;
function typeText(el, text, speed, token){
  return new Promise(res=>{
    if(reducedMotion()){ el.textContent = text; return res(); }
    let i=0;
    (function tick(){
      if(token!==typeToken || !document.body.contains(el)) return res();
      el.textContent = text.slice(0, ++i);
      if(i<text.length) setTimeout(tick, speed); else res();
    })();
  });
}
function hlCode(code){
  const m = code.match(/^([a-z0-9_]+)(\(.*\))$/);
  if(!m) return esc(code);
  const args = esc(m[2]).replace(/(&quot;|")([^"]*)(&quot;|")/g, '<span class="str">"$2"</span>');
  return '<span class="fn">'+esc(m[1])+'</span><span class="arg">'+args+'</span>';
}
async function showDemo(){
  const token = ++typeToken;
  const body = document.getElementById("demo-body");
  const tabs = document.getElementById("demo-tabs");
  if(!body || !tabs) return;
  const d = DEMOS[demoIdx];
  tabs.innerHTML = DEMOS.map((xx,i)=>'<button data-i="'+i+'" class="'+(i===demoIdx?"active":"")+'" onclick="App.demoTab('+i+')">'+esc(xx.tab[state.lang])+'</button>').join("");
  body.innerHTML = '<p class="q"><span class="typed"></span><span class="cursor"></span></p><pre style="visibility:hidden"><code></code></pre><p class="status"></p><p class="a"></p><p class="ask"></p>';
  await typeText(body.querySelector(".typed"), d.q[state.lang], 26, token);
  if(token!==typeToken || !document.body.contains(body)) return;
  const pre = body.querySelector("pre");
  pre.style.visibility = "visible";
  pre.querySelector("code").innerHTML = hlCode(d.code);
  body.querySelector(".status").textContent = d.status[state.lang];
  body.querySelector(".a").textContent = d.a[state.lang];
  body.querySelector(".ask").innerHTML = '<a href="'+hashFor("ask", encodeURIComponent(d.q[state.lang]))+'">'+esc(t("demo_ask"))+'</a> · '+esc(t("demo_nosignup"));
}
function startDemo(){
  clearInterval(demoTimer);
  demoTimer = setInterval(()=>{ demoIdx = (demoIdx+1)%DEMOS.length; showDemo(); }, 11000);
  showDemo();
}
function stopDemo(){ clearInterval(demoTimer); typeToken++; }

const mp = { q:"", cat:"all", platform:"all", conn:"all", status:"all", sort:"popular", openId:null, feat:false, official:false, local:false, profile:false, nokey:false, nochange:false };
function mpFiltered(){
  let list = SERVERS.slice();
  const q = mp.q.trim().toLowerCase();
  if(q) list = list.filter(s => (s.id+" "+s.title+" "+s.title_de+" "+serverDesc(s)+" "+s.tools.map(xx=>xx.n+" "+toolSum(xx)).join(" ")).toLowerCase().includes(q));
  if(mp.cat!=="all") list = list.filter(s=>s.cat===mp.cat);
  if(mp.feat) list = list.filter(s=>s.featured);
  if(mp.official) list = list.filter(s=>isOfficial(s));
  if(mp.sort==="popular") list.sort((a,b)=>(b.featured-a.featured) || b.tools.length-a.tools.length || a.id.localeCompare(b.id));
  if(mp.sort==="newest") list.sort((a,b)=>b.added-a.added);
  if(mp.sort==="alpha") list.sort((a,b)=>a.id.localeCompare(b.id));
  return list;
}
function mpMatches(q){
  const s = q.trim().toLowerCase(); if(!s) return {skills:[],tuts:[],arts:[]};
  return {
    skills: SKILLS.filter(k=>(k.id+" "+skillTag(k)).toLowerCase().includes(s)),
    tuts: TUTORIALS.filter(xx=>(L(xx.title)+" "+L(xx.ex)).toLowerCase().includes(s)),
    arts: ARTICLES.filter(a=>(L(a.title)+" "+L(a.ex)).toLowerCase().includes(s))
  };
}
function mpResultsHTML(){
  const list = mpFiltered();
  const m = mpMatches(mp.q);

  let h = (showMeta?metaCardHTML():"") + '<p class="mono" style="color:var(--mut);font-size:12.5px;margin-bottom:14px">['+fmtNum(list.length)+'] '+t("results")+'</p>';
  if(!list.length && !showMeta && !m.skills.length && !m.tuts.length && !m.arts.length) return h + emptyHTML() + '<p style="text-align:center;margin-top:14px"><a class="btn btn-ghost btn-sm" href="'+hashFor("submit")+'">'+nt("pal_suggest")+' →</a></p>';
  if(list.length) h += '<div class="card-grid">'+list.map(serverRow).join("")+'</div>';
  const extra = [];
  if(m.skills.length) extra.push('<h3 style="margin:26px 0 12px">'+t("match_skills")+' ('+fmtNum(m.skills.length)+')</h3><div class="ledger">'+m.skills.map(skillCard).join("")+'</div>');

function palListHTML(){

  return groups.map(pair=>{

  }).join("");
}

function nt(k){ const d = NT[state.lang]||NT.en; return d[k]!==undefined?d[k]:(NT.en[k]!==undefined?NT.en[k]:k); }

/* ================= PORT 2026-11-18 — new features (no-backend) ================= */
const BUILD_DATE = "2026-11-26";
const REPO_URL = "https://github.com/mohammad-abbasi-sh/germany-mcp";
const SITE_URL = "https://mohammad-abbasi-sh.github.io/germany-mcp/";
function isOfficial(s){ return /official|api/i.test(s.desc||""); }
function healthOf(s){ return {status:"verified", checked:BUILD_DATE}; }
function shortId(s){ return s.id.replace("-mcp",""); }
function b64url(str){ try{ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }catch(e){ return ""; } }
function downloadBlob(text, filename, mime){
  const blob = new Blob([text], {type:mime||"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function toast(msg){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("show"), 2400);
}
function labelsHTML(s){
  return '<span class="chip">⌘ '+nt("lb_run_v")+'</span>'
    + '<span class="chip">'+(isOfficial(s)?"✓ "+nt("lb_official"):"! "+nt("lb_warn_unofficial"))+'</span>'
    + '<span class="chip">✓ '+t("badge_nokey")+'</span>';
}

function sampleQs(s){
  const out = []; const used = {};
  s.tools.forEach(tl=>{
    if(out.length>=3) return;
    const tpl = SAMPLE_Q.find(x=>tl.n.indexOf(x.m)>=0);
    const key = tpl?tpl.m:"gen:"+tl.n;
    if(used[key]) return; used[key] = 1;
    if(tpl) out.push({q:tpl.q, tool:tl.n});
    else out.push({q:{fa:"ابزار «"+tl.n+"» چه می‌کند؟", de:"Was macht das Tool «"+tl.n+"»?", en:"What does the tool «"+tl.n+"» do?"}, tool:tl.n});
  });
  return out;
}
function demoAnswer(s, tl){
  const sum = toolSum(tl);
  return {
    fa:"پاسخ نمونه: «"+sum+"» — دادهٔ زنده بعد از نصب سرور می‌آید.",
    de:"Beispielantwort: «"+sum+"» — Live-Daten gibt es nach der Installation des Servers.",
    en:"Sample answer: «"+sum+"» — live data comes after you install the server."
  };
}
/* ---- per-server Markdown (in-page view + Blob download, no separate files) ---- */
function serverMd(s){
  const lines = ["# "+s.title, "", serverDesc(s), "",
    "- Catalog: "+SITE_URL+"#/en/tool/"+s.id,
    "- Repository: "+s.repo,
    "- PyPI: https://pypi.org/project/"+s.pypi+"/",
    "- Category: "+s.cat+" · Tools: "+s.tools.length+" · Runs: local stdio with uvx · API key: none",
    "- Last checked: "+BUILD_DATE, "",
    "## Install", "",
    "```",
    "claude mcp add --transport stdio --scope user "+shortId(s)+" -- uvx "+s.pypi,
    "```", "",
    "## Tools", ""];
  s.tools.forEach(tl=>lines.push("- `"+tl.n+"`: "+tl.s));
  lines.push("", "## Sample questions", "");
  sampleQs(s).forEach(q=>lines.push("- "+q.q.en+" (`"+q.tool+"`)"));
  return lines.join("\n");
}

 {id:"claude-code", name:"Claude Code", kind:"cli", file:"—"},

const BUILDER = {ids:[], app:"claude-code", os:"mac", q:"", cat:"all", custom:null};
function builderLoad(){
  try{
    const saved = store.get("de_builder_ids", null);
    if(Array.isArray(saved)) BUILDER.ids = saved.filter(id=>SERVERS.some(s=>s.id===id));
    const app = store.get("de_builder_app", null);
    if(app && BUILDER_APPS.some(a=>a.id===app)) BUILDER.app = app;
    const custom = store.get("de_builder_custom", null);
    if(custom && custom.name && custom.url) BUILDER.custom = custom;
  }catch(e){}
}
function builderSave(){ store.set("de_builder_ids", BUILDER.ids); store.set("de_builder_app", BUILDER.app); store.set("de_builder_custom", BUILDER.custom); }
function builderFromQuery(){
  builderLoad();
  if(state.query.ids){
    const ids = state.query.ids.split(",").map(x=>x.trim()).filter(id=>SERVERS.some(s=>s.id===id));
    if(ids.length) BUILDER.ids = ids;
  }
  if(state.query.app && BUILDER_APPS.some(a=>a.id===state.query.app)) BUILDER.app = state.query.app;
  builderSave();
}
function builderSyncURL(){
  const q = [];
  if(BUILDER.ids.length) q.push("ids="+BUILDER.ids.map(encodeURIComponent).join(","));
  if(BUILDER.app!=="claude-code") q.push("app="+BUILDER.app);
  const h = "#/"+state.lang+"/builder"+(q.length?"?"+q.join("&"):"");
  try{ history.replaceState(null, "", h); }catch(e){}
}
function builderServers(){ return BUILDER.ids.map(id=>SERVERS.find(s=>s.id===id)).filter(Boolean); }
function builderConfig(){
  const app = BUILDER_APPS.find(a=>a.id===BUILDER.app) || BUILDER_APPS[0];
  const servers = builderServers();
  const custom = BUILDER.custom;
  if(app.kind==="cli"){
    const lines = servers.map(s=>"claude mcp add --transport stdio --scope user "+shortId(s)+" -- uvx "+s.pypi);
    if(custom) lines.push("# "+custom.name+": remote servers cannot be added with `claude mcp add` — add it manually to your config: "+custom.url);
    return {text:lines.join("\n"), filename:"install-servers.sh", kind:"cli"};
  }
  const mcp = {};
  servers.forEach(s=>{ mcp[shortId(s)] = {command:"uvx", args:[s.pypi]}; });
  if(custom){
    const entry = app.kind==="vscode" ? {type:"http", url:custom.url} : {url:custom.url};
    if(custom.header){ const i = custom.header.indexOf(":"); if(i>0){ const k = custom.header.slice(0,i).trim(); const v = custom.header.slice(i+1).trim(); if(k&&v) entry.headers = {}; if(k&&v) entry.headers[k] = v; } }
    mcp[custom.name] = entry;
  }
  if(app.kind==="vscode") return {text:JSON.stringify({servers:mcp}, null, 2), filename:"mcp.json", kind:"json"};
  return {text:JSON.stringify({mcpServers:mcp}, null, 2), filename:".mcp.json", kind:"json"};
}
function builderConfigPath(){
  const app = BUILDER.app; const os = BUILDER.os;
  if(app==="claude-desktop") return os==="win" ? "%APPDATA%\\Claude\\claude_desktop_config.json" : os==="linux" ? "~/.config/Claude/claude_desktop_config.json" : "~/Library/Application Support/Claude/claude_desktop_config.json";
  if(app==="cursor") return os==="win" ? "%USERPROFILE%\\.cursor\\mcp.json" : "~/.cursor/mcp.json";
  if(app==="vscode") return ".vscode/mcp.json";
  if(app==="windsurf") return os==="win" ? "%USERPROFILE%\\.codeium\\windsurf\\mcp_config.json" : "~/.codeium/windsurf/mcp_config.json";
  if(app==="gemini-cli") return os==="win" ? "%USERPROFILE%\\.gemini\\settings.json" : "~/.gemini/settings.json";
  return "";
}
function builderInstaller(){
  const cfg = builderConfig();
  const app = BUILDER_APPS.find(a=>a.id===BUILDER.app) || BUILDER_APPS[0];
  const os = BUILDER.os;
  if(app.kind==="cli"){
    const lines = [cfg.text, "", "# "+nt("b_smoke"), "claude mcp list"];
    if(os==="win") lines.unshift("where.exe uvx >nul 2>nul || powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\"");
    else lines.unshift("command -v uvx >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh");
    return lines.join("\n");
  }
  const path = builderConfigPath();
  if(os==="win"){
    return "where.exe uvx >nul 2>nul || powershell -ExecutionPolicy ByPass -c \"irm https://astral.sh/uv/install.ps1 | iex\"\n"
      + "$cfg = @'\n"+cfg.text+"\n'@\n"
      + "New-Item -ItemType Directory -Force -Path (Split-Path '"+path+"') | Out-Null\n"
      + "Set-Content -Path '"+path+"' -Value $cfg -Encoding UTF8\n"
      + "# "+nt("b_smoke")+"\nGet-Content '"+path+"' | ConvertFrom-Json | Out-Null; Write-Host OK";
  }
  const dir = path.indexOf("/")>=0 ? path.slice(0, path.lastIndexOf("/")) : ".";
  return "command -v uvx >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh\n"
    + "mkdir -p "+dir+"\ncat > "+path+" <<'EOF'\n"+cfg.text+"\nEOF\n"
    + "# "+nt("b_smoke")+"\npython3 -m json.tool "+path+" >/dev/null && echo OK";
}

  const vscode = "vscode:mcp/install?"+encodeURIComponent(JSON.stringify({name:shortId(s), command:"uvx", args:[s.pypi]}));
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'
    + '<a class="btn btn-ghost btn-sm" href="'+cursor+'">'+nt("b_deeplink_cursor")+' · '+esc(shortId(s))+'</a>'
    + '<a class="btn btn-ghost btn-sm" href="'+vscode+'">'+nt("b_deeplink_vscode")+' · '+esc(shortId(s))+'</a></div>';
}

  return '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-ghost btn-sm" href="'+cursor+'">'+nt("b_deeplink_cursor")+'</a><a class="btn btn-ghost btn-sm" href="'+vscode+'">'+nt("b_deeplink_vscode")+'</a></div>';

/* Marketplace visibility: pinned above the catalog by default. Hidden only
   when a filter excludes it — a single-category filter (it belongs to no
   one category), the official-source filter (it is unofficial), or a text
   query that does not match it. Featured/local/no-key/no-change filters
   all include it. */
function metaVisible(){
  if(mp.cat!=="all") return false;
  if(mp.official) return false;
  const q = mp.q.trim();
  if(!q) return true;
  const toks = askTokens(q);
  if(!toks.length) return true;
  const hay = metaHay();
  return toks.every(w=>hay.indexOf(w)>=0);
}

const SUBMIT = {name:"", nameEn:"", summary:"", cat:"news", tags:"", repo:"", license:"", install:""};
function submitSlug(){ return (SUBMIT.nameEn||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "new-server"; }
function submitIssueURL(){
  const title = "New server: "+(SUBMIT.nameEn||SUBMIT.name||submitSlug());
  const body = ["## Server suggestion", "",
    "- Name (FA): "+(SUBMIT.name||"—"), "- Name (EN): "+(SUBMIT.nameEn||"—"),
    "- ID: "+submitSlug(), "- Summary: "+(SUBMIT.summary||"—"),
    "- Category: "+SUBMIT.cat, "- Tags: "+(SUBMIT.tags||"—"),
    "- Repository: "+(SUBMIT.repo||"—"), "- License: "+(SUBMIT.license||"—"),
    "- Install: `"+(SUBMIT.install||"—")+"`", "",
    "Submitted from the Germany MCP catalog (static form — no account)."].join("\n");
  return REPO_URL+"/issues/new?title="+encodeURIComponent(title)+"&body="+encodeURIComponent(body);
}

const SEARCH = {loaded:false, loading:false, idx:null};
function searchLoad(){
  if(SEARCH.loaded || SEARCH.loading) return;
  SEARCH.loading = true;
  fetch("search.json").then(r=>{ if(!r.ok) throw new Error("no search.json"); return r.json(); })
    .then(j=>{ SEARCH.idx = j; SEARCH.loaded = true; if(PAL.open) palListRender(); })
    .catch(()=>{ SEARCH.loaded = true; SEARCH.idx = null; });
}
function palBuildPort(q){
  const items = [];
  const ql = askNorm(q);
  /* all-mcp first: it is the main reference, so it tops the palette on an
     empty query and whenever the query matches it. */
  const metaHit = (()=>{
    if(!ql) return true;
    const toks = ql.split(" ").filter(w=>w.length>1);
    if(!toks.length) return true;
    const hay = metaHay();
    return toks.every(w=>hay.indexOf(w)>=0);
  })();
  if(metaHit) items.push({group:"servers", pid:"META", name:metaTitle(), sub:"all-mcp · "+fmtNum(META.servers)+" "+t("stat_servers")+" · "+fmtNum(META.tools)+" "+t("stat_tools"), tag:"★", page:"tool", param:"all-mcp"});
  if(SEARCH.idx && ql){
    const toks = ql.split(" ").filter(w=>w.length>1);
    const scored = SEARCH.idx.map(e=>{
      const hay = askNorm(e.s||"");
      let score = 0;
      toks.forEach(w=>{ if(hay.indexOf(w)>=0) score += 2; });
      if(askNorm(e.name||"").indexOf(ql)>=0) score += 5;
      return {e:e, score:score};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
    scored.forEach(x=>{
      const s = SERVERS.find(v=>v.id===x.e.id);
      items.push({group:"servers", pid:s?serverNo(s):"DE", name:x.e.name, sub:x.e.id, tag:s?catCode(s.cat):"", page:"tool", param:x.e.id});
    });
  } else {
    const res = q ? askScore(q) : SERVERS.slice().sort((a,b)=>a.added-b.added).slice(0,5).map(s=>({s:s, score:0, matched:[]}));
    res.slice(0,5).forEach(r=>items.push({group:"servers", pid:serverNo(r.s), name:r.s.title.split(" — ")[0], sub:r.s.id, tag:catCode(r.s.cat), page:"tool", param:r.s.id}));
  }
  if(q && ql){
    FAQ.forEach(f=>{
      const hay = askNorm(L(f.q)+" "+L(f.a));
      const hit = hay.indexOf(ql)>=0 || ql.split(" ").some(w=>w.length>2 && hay.indexOf(w)>=0);
      if(hit) items.push({group:"faq", pid:"FAQ", name:L(f.q), sub:L(f.a).slice(0,80)+"…", tag:"?", page:"about", param:null});
    });
  }
  PAL_PAGES.forEach(p=>{
    const label = t(p.nav);
    if(!q || askNorm(label+" "+p.page).indexOf(ql)>=0 || p.page.indexOf(ql)>=0)
      items.push({group:"pages", pid:"PAGE", name:label, sub:"/"+p.page, tag:"→", page:p.page, param:null});
  });
  if(q && !items.length){
    items.push({group:"pages", pid:"+", name:nt("pal_suggest"), sub:q, tag:"→", page:"submit", param:null});
  }
  return items.slice(0,14);
}

  }
};

/* ---------------- router glue ---------------- */
function pageHTML(){
  switch(state.page){
    case "home": return homeHTML();
    case "marketplace": return marketplaceHTML();
    case "tool": return toolHTML(state.param);
    case "categories": return categoriesHTML();
    case "skills": return skillsHTML();
    case "skill": return skillHTML(state.param);
    case "tutorials": return tutorialsHTML();
    case "tutorial": return tutorialHTML(state.param);
    case "blog": return blogHTML();
    case "article": return articleHTML(state.param);
    case "about": return aboutHTML();
    case "contact": return contactHTML();
    case "favorites": return favoritesHTML();
    case "ask": return askHTML();
    case "connect": return connectHTML();
    case "builder": return builderHTML();
    case "demo": return demoHTML();
    case "status": return statusHTML();
    case "guide": return guideHTML();
    case "submit": return submitHTML();
    case "my": return myHTML();
    case "privacy": return privacyHTML();
    case "terms": return termsHTML();
    default: return notFoundHTML();
  }
}
function pageTitle(){
  const base = "Germany MCP";
  const map = {home:t("hero_title"),marketplace:t("mp_title"),categories:t("cats_page_title"),skills:t("skills_page_title"),tutorials:t("tut_page_title"),blog:t("blog_page_title"),about:t("about_title"),contact:t("contact_title"),favorites:t("fav_title"),ask:t("ask_title"),connect:t("conn_title"),builder:nt("b_title"),demo:nt("demo_title"),status:nt("st_title"),guide:nt("g_title"),submit:nt("s_title"),my:nt("my_title"),privacy:nt("p_title"),terms:nt("t_title"),"404":t("nf_title")};
  if(state.page==="tool"){ if(state.param==="all-mcp") return "all-mcp — "+metaTitle()+" — "+base; const s=SERVERS.find(xx=>xx.id===state.param); return s? s.title+" — "+base : base; }
  if(state.page==="skill"){ const k=SKILLS.find(xx=>xx.id===state.param); return k? k.id+" — "+base : base; }
  if(state.page==="tutorial"){ const xx=TUTORIALS.find(v=>v.id===state.param); return xx? L(xx.title)+" — "+base : base; }
  if(state.page==="article"){ const a=ARTICLES.find(v=>v.id===state.param); return a? L(a.title)+" — "+base : base; }
  return (map[state.page]||t("hero_title"))+" — "+base;
}
let lastPage = null;
function render(){
  parseHash();
  stopDemo();
  if(state.page==="builder" && lastPage!=="builder") builderFromQuery();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = LANGS[state.lang].dir;
  document.documentElement.setAttribute("data-theme", state.theme);
  document.title = pageTitle();
  const md = document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content", t("hero_sub"));
  const app = document.getElementById("app");
  app.innerHTML = bannerHTML() + headerHTML() + '<main id="main">' + pageHTML() + '</main>' + footerHTML() + mobnavHTML();
  const skip = document.querySelector(".skip"); if(skip) skip.textContent = t("a11y_skip");
  if(state.page==="tool"){ const act=document.querySelector(".row-mini.active"); if(act) act.scrollIntoView({block:"nearest"}); }
  if(state.anchor){ const el=document.getElementById(state.anchor); if(el) el.scrollIntoView(); state.anchor=null; }
  lastPage = state.page;
  if(state.page==="home") startDemo();
  afterRender();
}

/* ---------------- App actions ---------------- */
window.App = {
  setLang(l){ if(!LANGS[l]) return; state.lang=l; store.set("tmp_lang", l);
    const h=(location.hash||"").replace(/^#\/?/,""); const parts=h.split("/").filter(Boolean);
    if(["fa","de","en"].includes(parts[0])) parts[0]=l; else parts.unshift(l);
    location.hash = "#/"+parts.join("/"); render(); },
  toggleTheme(){ state.theme = state.theme==="dark"?"light":"dark"; store.set("tmp_theme", state.theme); document.documentElement.setAttribute("data-theme", state.theme); const b=document.querySelector('button[onclick="App.toggleTheme()"]'); if(b){ const l=t(state.theme==="dark"?"theme_light":"theme_dark"); b.textContent=l; b.setAttribute("aria-label",l); b.setAttribute("title",l); } },
  toggleFav(type,id,ev){ if(ev) ev.stopPropagation();
    const f = favs(); const i = f.findIndex(xx=>xx.type===type&&xx.id===id);
    if(i>=0){ f.splice(i,1); } else { f.push({type:type,id:id}); }
    store.set("tmp_favs_v1", f); render(); },
  copy(txt, btn, ev){ copyText(txt, btn, ev); },
  copyIcon(txt, btn, ev){ if(ev) ev.stopPropagation(); const done=()=>{ if(btn){ btn.classList.add("copied"); clearTimeout(btn._t); btn._t=setTimeout(()=>btn.classList.remove("copied"),1800); } }; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); } else fallbackCopy(txt,done); },
  demoTab(i){ demoIdx=i; showDemo(); },
  connApp(id){ CONNECT_STATE.app=id; render(); },
  connTrack(tr){ CONNECT_STATE.track=tr; render(); },
  heroSearch(ev){ ev.preventDefault(); const q=document.getElementById("hero-q"); mp.q=q?q.value:""; mp.cat="all"; go("marketplace"); render(); return false; },
  askSearch(v){ ASK_STATE.q=v; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(v,askScore(v)); },
  askChip(txt){ ASK_STATE.q=txt.trim(); const inp=document.getElementById("ask-q"); if(inp) inp.value=ASK_STATE.q; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); },
  askSubmit(ev){ ev.preventDefault(); const inp=document.getElementById("ask-q"); ASK_STATE.q=inp?inp.value:""; const el=document.getElementById("ask-results"); if(el) el.innerHTML=askResultsHTML(ASK_STATE.q,askScore(ASK_STATE.q)); return false; },
  openCategory(id){ mp.cat=id; mp.q=""; go("marketplace"); render(); },
  mpSearch(v){ mp.q=v; flipSwap(document.getElementById("mp-results"), mpResultsHTML()); mpSyncURL(); },
  mpFilter(k,v){ mp[k]=v; flipSwap(document.getElementById("mp-results"), mpResultsHTML()); syncRail(); mpSyncURL(); },
  skillSearch(v){ skillsHTML._q=v;
    const q=v.trim().toLowerCase(); const cat=skillsHTML._cat||"all";
    const list=SKILLS.filter(k=>(!q||(k.id+" "+skillTag(k)+" "+skillGap(k)).toLowerCase().includes(q))&&(cat==="all"||k.cat===cat));
    flipSwap(document.getElementById("skills-results"), list.length?'<div class="ledger">'+list.map(skillCard).join("")+'</div>':emptyHTML()); },
  skillFilter(v){ skillsHTML._cat=v; App.skillSearch(skillsHTML._q||""); },
  toggleRow(id, ev){
    mp.openId = (mp.openId===id)?null:id;
    document.querySelectorAll(".row[data-row]").forEach(r=>{
      const on = r.dataset.row===id && mp.openId===id;
      r.classList.toggle("open", on);
      const g = r.querySelector(".row-grid"); if(g) g.setAttribute("aria-expanded", on?"true":"false");
      const ch = r.querySelector(".chev"); if(ch) ch.textContent = on?"−":"+";
    });
  },
  openFilters(){ const s=document.getElementById("sheet"); const sc=document.getElementById("sheet-scrim"); if(s) s.classList.add("open"); if(sc) sc.classList.add("open"); },
  closeFilters(){ const s=document.getElementById("sheet"); const sc=document.getElementById("sheet-scrim"); if(s) s.classList.remove("open"); if(sc) sc.classList.remove("open"); },
  palOpen(){ searchLoad(); PAL.open=true; PAL.q=""; PAL.items=palBuild(""); PAL.active=0; palRender(); const inp=document.getElementById("pal-q"); if(inp) inp.focus(); },
  palClose(){ PAL.open=false; palRender(); },
  palSearch(v){ PAL.q=v; PAL.items=palBuild(v); PAL.active=0; const inp=document.getElementById("pal-q"); if(inp && inp.value!==v) inp.value=v; palListRender(); },
  palHover(i){ PAL.active=i; document.querySelectorAll(".pal-item").forEach(el=>el.classList.toggle("active", Number(el.dataset.pal)===i)); },
  palKey(key){
    if(!PAL.items.length) return;
    if(key==="ArrowDown"){ PAL.active=(PAL.active+1)%PAL.items.length; palListRender(); }
    if(key==="ArrowUp"){ PAL.active=(PAL.active-1+PAL.items.length)%PAL.items.length; palListRender(); }
    if(key==="Enter"){ App.palGo(PAL.active); }
  },
  palGo(i){ const it=PAL.items[i]; if(!it) return; PAL.open=false; palRender(); go(it.page, it.param); }
};
Object.assign(window.App, PORT_APP_ACTIONS);

/* ---------------- init ---------------- */
document.addEventListener("keydown", function(ev){
  if((ev.metaKey||ev.ctrlKey) && (ev.key==="k"||ev.key==="K")){ ev.preventDefault(); App.palOpen(); return; }
  if(ev.key==="Escape" && PAL.open){ App.palClose(); return; }
  if(PAL.open && (ev.key==="ArrowDown"||ev.key==="ArrowUp"||ev.key==="Enter")){ ev.preventDefault(); App.palKey(ev.key); }
});
window.addEventListener("hashchange", ()=>{
  const prev = lastPage;
  render();
  const h=location.hash||"";
  if((h.startsWith("#/") || !h) && state.page!==prev) window.scrollTo({top:0});
});
palRender();
if(!location.hash) location.hash = "#/"+state.lang+"/";
render();

</script>
